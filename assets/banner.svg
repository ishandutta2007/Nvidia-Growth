<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 800 250"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070a13"/></linearGradient><linearGradient id="nvidiaGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#76B900"/><stop offset="100%" stop-color="#a3e635"/></linearGradient><linearGradient id="blueGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{filter:drop-shadow(0 0 5px rgba(118,185,0,.4))}50%{filter:drop-shadow(0 0 15px rgba(118,185,0,.8))}}@keyframes floatParticle{0%{transform:translate(0,0)}50%{transform:translate(10px,-15px)}}.grid{stroke:#1f2937;stroke-width:1;opacity:.4}.glowing-trend,.headcount-trend{stroke:url(#nvidiaGrad);stroke-width:4;fill:none;stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawLine 3s ease-out forwards,pulseGlow 3s infinite alternate}.headcount-trend{stroke:url(#blueGrad);stroke-width:3;animation:drawLine 4s ease-out forwards;opacity:.8}.subtitle-text,.title-text{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.title-text{font-weight:900;fill:#fff;letter-spacing:4px}.subtitle-text{font-weight:500;fill:#9ca3af;letter-spacing:2px}.accent-green{fill:#76b900}</style><rect width="800" height="250" fill="url(#bgGrad)"/><g class="grid"><line x1="0" x2="800" y1="50" y2="50"/><line x1="0" x2="800" y1="100" y2="100"/><line x1="0" x2="800" y1="150" y2="150"/><line x1="0" x2="800" y1="200" y2="200"/><line x1="100" x2="100" y1="0" y2="250"/><line x1="200" x2="200" y1="0" y2="250"/><line x1="300" x2="300" y1="0" y2="250"/><line x1="400" x2="400" y1="0" y2="250"/><line x1="500" x2="500" y1="0" y2="250"/><line x1="600" x2="600" y1="0" y2="250"/><line x1="700" x2="700" y1="0" y2="250"/></g><path d="M 50 200 Q 200 190 350 160 T 650 90 T 750 40" class="glowing-trend"/><path d="M 50 200 L 225 185 L 400 170 L 575 155 L 750 140" class="headcount-trend"/><circle cx="750" cy="40" r="6" fill="#76B900" filter="url(#glow)"/><circle cx="750" cy="140" r="5" fill="#3b82f6"/><g><text x="0" y="0" class="title-text" font-size="34" transform="translate(60, 110)">NVIDIA <tspan class="accent-green">GROWTH</tspan> HUB</text><text x="0" y="30" class="subtitle-text" font-size="12" transform="translate(60, 110)">10-YEAR HISTORICAL VISUALIZATION &amp; ANALYSIS</text><text x="0" y="50" fill="#6b7280" class="subtitle-text" font-size="10" transform="translate(60, 110)">VALUATION LEVERAGE: 121.5x MARKET CAP vs 4.6x HEADCOUNT</text></g></svg>